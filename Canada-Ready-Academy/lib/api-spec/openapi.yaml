openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Canada Ready Academy API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: assessments
    description: Free assessment bookings
  - name: contacts
    description: Contact form submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /assessments:
    get:
      operationId: listAssessments
      tags: [assessments]
      summary: List all assessment submissions
      responses:
        "200":
          description: List of assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assessment"
    post:
      operationId: createAssessment
      tags: [assessments]
      summary: Submit a free assessment form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssessmentBody"
      responses:
        "201":
          description: Assessment submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"
        "400":
          description: Invalid request

  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List all contact form submissions
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Submit a contact form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactBody"
      responses:
        "201":
          description: Contact submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: Invalid request

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Assessment:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        whatsapp:
          type: string
        englishLevel:
          type: string
        country:
          type: string
        careerGoals:
          type: string
        timeInCanada:
          type: string
        biggestChallenge:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - whatsapp
        - englishLevel
        - country
        - careerGoals
        - timeInCanada
        - biggestChallenge
        - createdAt

    CreateAssessmentBody:
      type: object
      properties:
        name:
          type: string
        whatsapp:
          type: string
        englishLevel:
          type: string
        country:
          type: string
        careerGoals:
          type: string
        timeInCanada:
          type: string
        biggestChallenge:
          type: string
      required:
        - name
        - whatsapp
        - englishLevel
        - country
        - careerGoals
        - timeInCanada
        - biggestChallenge

    Contact:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        whatsapp:
          type: ["string", "null"]
        message:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - whatsapp
        - message
        - createdAt

    CreateContactBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        whatsapp:
          type: ["string", "null"]
        message:
          type: string
      required:
        - name
        - email
        - message
